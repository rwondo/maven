[project]
name = "maven-ai"
version = "2.0.0"
description = "Prototype that asks several LLMs to review an answer and flags likely hallucinations"
authors = [{name = "Arber Ferra", email = "ferraarber@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "hallucination", "hallucination-detection", "evaluation", "multi-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Lower bounds are the versions the test suite was run with; upper bounds stop the next
# major release (which may break the API calls) from being installed automatically.
# requirements-dev.lock pins exact versions for CI.
dependencies = [
    "anthropic>=1.9,<2",
    "google-generativeai>=0.8.6,<0.9",
    "openai>=3.20,<4",
    "tenacity>=9.1,<10",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pre-commit>=4.6,<5",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/rwondo/maven"
Repository = "https://github.com/rwondo/maven.git"
Issues = "https://github.com/rwondo/maven/issues"
Changelog = "https://github.com/rwondo/maven/blob/main/CHANGELOG.md"

[project.scripts]
maven = "maven.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maven = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # long lines: the formatter wraps code; long strings are left as they are
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # lets tests import scripts/evaluate_truthfulqa.py
addopts = "--strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    # google-generativeai warns on import that it is no longer maintained (see README)
    'ignore:\s*All support for the `google.generativeai` package has ended:FutureWarning',
]

[tool.coverage.run]
source = ["maven"]
branch = true
